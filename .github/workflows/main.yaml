---

name: CI (Main branch)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  docker:
    uses: naviteq/github-actions/.github/workflows/docker-build.yaml@2d24c385f4cad195aec1ad38084e2abb576cdc58 # v1.70.0
    with:
      REGISTRY: ghcr.io
      DOCKER_CONTEXT: app
      IMAGE: ${{ github.repository }}
      USERNAME: ${{ github.actor }}
      VERSION_TAG_V_PREFIX: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    uses: naviteq/github-actions/.github/workflows/helm-release-github.yaml@2d24c385f4cad195aec1ad38084e2abb576cdc58 # v1.70.0
    needs: [docker]
    with:
      chart_path: helm
      ghcr_repo: ${{ github.repository }}
      bump_version_in_git: false
    secrets:
      GITHUB_APP_ID: ${{ secrets.NAVITEQ_GITHUB_APP_ID }}
      GITHUB_APP_KEY: ${{ secrets.NAVITEQ_GITHUB_APP_KEY }}
      token: ${{ secrets.GITHUB_TOKEN }}

  release:
    uses: naviteq/github-actions/.github/workflows/create-release.yaml@2d24c385f4cad195aec1ad38084e2abb576cdc58 # v1.70.0
    needs:
      - docker
      - helm
    secrets:
      GITHUB_APP_ID: ${{ secrets.NAVITEQ_GITHUB_APP_ID }}
      GITHUB_APP_KEY: ${{ secrets.NAVITEQ_GITHUB_APP_KEY }}
